phase:
  number: "6.9"
  name: "macOS Button Inner-Rectangle Artifact"
  branch: "phase-06.9-macos-button-artifact"
  parent_branch: "feature/utility-first-css-asset-pipeline"
  parent_sha: "4cc2f45"
  authored_at: "2026-05-23"

# Phase 6.9 closes one residual cosmetic artifact from Phase 6.8 Fix 1
# (Capsule.fill bypass of .borderedProminent). On macOS, SwiftUI's
# default Button label rendering shows a smaller darker rectangle
# inside the larger brand-teal Capsule. Fix: append `.buttonStyle(.plain)`
# to suppress SwiftUI's default button chrome on the prominent case
# in ButtonFacade.swift. This is the canonical SwiftUI pattern for
# fully-custom button chrome.
#
# 1. SCOPE: 1 single-line fix in ButtonFacade.swift's `case "prominent":`
#    block. Append `.buttonStyle(.plain)` to the modifier chain.
#
# 2. NOT IN SCOPE: anything else. iOS Sign-in must not regress (Fix 1
#    Capsule fill rendered cleanly on iOS — `.plain` should not affect
#    iOS rendering since iOS doesn't have the default chrome that
#    macOS adds). All 3 Phase 6.8 fixes must remain working.
#
# 3. INVARIANT TOUCH PATTERN: Phase 6.9 is pure cosmetic polish; most
#    invariants are `preserves`. I-1 (render) is `extends` (new macOS
#    baseline). I-11 (build) is `extends` (ButtonFacade rebuild).
#
# 4. CODEX CHECK MANDATORY: after the fix, Codex compares macOS sign-in
#    baseline pre-vs-post. Verdict must be PROGRESS (artifact gone) AND
#    iOS sign-in must still show brand-teal pill (no regression).

invariant_matrix:
  - id: I-1
    name: "Render correctly"
    touch: extends
    rationale: "Phase 6.9 ships a single ButtonFacade.swift edit that suppresses SwiftUI's default Button label chrome on the prominent case via `.buttonStyle(.plain)`. macOS sign-in baseline re-captured; iOS sign-in baseline should not change (iOS doesn't have the artifact). Other baselines (dashboard, detail, settings, tier-three) untouched."
    probes:
      ios: "bash scripts/audit_harness_smoke.sh I-1 ios demo-sign-in"
      macos: "bash scripts/audit_harness_smoke.sh I-1 macos demo-sign-in"
      web: "bash scripts/audit_harness_smoke.sh I-1 web demo-sign-in"
      android:
        skip: true
        reason: "Android sim/emulator deferred per Phase 1 #17"
        owner_approved: "2026-05-23"

  - id: I-2
    name: "Update reactively (forward)"
    touch: preserves
    rationale: "ButtonStyle.plain doesn't change reactive bindings. Button tap handler dispatch is unchanged."
    probes:
      ios: "bash scripts/audit_harness_smoke.sh I-2 ios demo-sign-in"
      macos: "bash scripts/audit_harness_smoke.sh I-2 macos demo-sign-in"
      web: "bash scripts/audit_harness_smoke.sh I-2 web demo-sign-in"
      android:
        skip: true
        reason: "Android sim/emulator deferred per Phase 1 #17"
        owner_approved: "2026-05-23"

  - id: I-3
