lower_layer_assumptions:
  - id: A1
    claim: "Crystal toolchain available"
    falsifier: "Neither crystal-alpha nor crystal in PATH"
    verification: "which crystal-alpha || which crystal"

  - id: A2
    claim: "Phase 6.8 PASS tag exists (Phase 6.9 depends on Phase 6.8's Capsule.fill bypass)"
    falsifier: "Tag missing"
    verification: "git tag --list 'phase-06.8-pass-2026-05-23' | head -1 | grep -q phase-06.8"

  - id: A3
    claim: "ButtonFacade.swift contains the Phase 6.8 Fix 1 Capsule.fill block (precondition — Phase 6.9 adds .buttonStyle(.plain) to this block)"
    falsifier: "Capsule().fill not present in ButtonFacade.swift"
    verification: "grep -q 'Capsule().fill' swift/AssetPipelineSwiftKit/Sources/AssetPipelineSwiftKit/Facades/ButtonFacade.swift"

  - id: A4
    claim: "SwiftKit static archive builds at HEAD (precondition)"
    falsifier: "swift build -c release exits non-zero"
    verification: "swift build -c release --package-path swift/AssetPipelineSwiftKit > /dev/null 2>&1"

  - id: A5
    claim: "ImageMagick + compare installed"
    falsifier: "Either missing"
    verification: "test -x /opt/homebrew/bin/magick && test -x /opt/homebrew/bin/compare"

repo_derived_facts:
