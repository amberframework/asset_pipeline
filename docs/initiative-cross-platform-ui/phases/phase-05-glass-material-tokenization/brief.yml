adapter_cardinality:
  - public_api: "UI::DesignTokens::Material#semantic (AppleSemantic enum: Menu/Popover/Sidebar/Sheet/HeaderView/WindowBackground/HUDWindow/Titlebar/SystemResolved)"
    adapter: "NSVisualEffectMaterial (macOS) + UIBlurEffectStyle approximation (iOS) + SwiftUI Material (cross-platform fallback)"
    adapter_input_space: "8 NSVisualEffectMaterial integers on macOS; 5 UIBlurEffectStyle integers on iOS; 5 thickness Materials + .bar on SwiftUI"
    api_input_space: "9 AppleSemantic enum values"
    match_status: "MISMATCH"
    documented_degradation: "macOS maps every AppleSemantic value 1:1 to an NSVisualEffectMaterial integer EXCEPT SystemResolved which emits NO setMaterial: call (lets Apple defaults apply). iOS has no semantic NSVisualEffectMaterial equivalent — UIBlurEffectStyle is thickness-like. Phase 5 v2 ships an approximation table on iOS: Menu→systemUltraThinMaterial, Popover→systemMaterial, Sidebar→systemThinMaterial, Sheet→systemThickMaterial, HeaderView/HUDWindow→systemChromeMaterial, WindowBackground/Titlebar→systemMaterial, SystemResolved→no setEffect: call. The approximation is documented in the v2 architecture doc's per-widget table; consumers wanting per-platform fidelity beyond the approximation must override per-widget. Brand intensity is ADVISORY on Apple because NSVisualEffectMaterial / UIBlurEffectStyle are role-based, not intensity-scaled — Apple decides material strength."
    owner_approved: "2026-05-22"

