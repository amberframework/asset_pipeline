    documented_degradation: "QUANTIZER MODEL: brand intensity * declared-step baseline → effective ThicknessStep (per the architecture's thickness_for_brand quantizer); the effective step's predefined blur_radius then applies. This is a behavior change from iter1's proportional-scaling code path — iter1 multiplied step.blur_radius by intensity directly; v2 quantizes step selection instead. Browsers without backdrop-filter (detected via @supports not (backdrop-filter: blur(1px))) fall back to background-color: color-mix(in oklch, var(--ap-color-surface-panel) Z%, transparent) where Z is the effective step's predefined opacity (ultra_thin=20%, thin=40%, regular=60%, thick=73%, chrome=87%). No blur radius in the fallback path; opacity is also chosen from the effective step (not proportionally scaled). WCAG-AA contrast verified for text-on-fallback as well as text-on-blurred at every effective step. NOTE TO IMPLEMENTER: if migrating from proportional to quantizer breaks the existing samples/cross_platform/web/brand_glass_intensity_demo.cr behavior in a consumer-visible way, surface to architect before shipping — the demo may need re-authoring to demonstrate quantizer-driven step transitions rather than continuous blur scaling."
