name: CI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
    branches:
      - "**"

  pull_request:
    branches:
      - "**:**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26  # v3
      - uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f  # v1
      - run: shards install
      - run: crystal run test/*_test.cr -- --verbose
      - run: crystal run -Dpreview_mt test/*_test.cr -- --verbose --parallel 4 --chaos
