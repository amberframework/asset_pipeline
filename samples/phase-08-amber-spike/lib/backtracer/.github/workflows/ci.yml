name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # Every monday at 3 AM

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        crystal: [latest, nightly]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Install Crystal
        uses: oprypin/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f  # v1
        with:
          crystal: ${{ matrix.crystal }}

      - name: Download source
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e  # v2

      - name: Install dependencies
        run: shards install
        env:
          SHARDS_OPTS: --ignore-crystal-version

      - name: Run specs
        run: |
          crystal spec
          crystal spec --no-debug

      - name: Run specs (release)
        run: |
          crystal spec --release
          crystal spec --release --no-debug

      - name: Check formatting
        run: crystal tool format --check

      - name: Run ameba linter
        run: bin/ameba
